<!DOCTYPE html>
<html lang="en">

<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap" rel="stylesheet">

<body class="auth-body page-password-reset">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-intro">
                <div class="security-icon" style="color: #16a34a;"></div>
                <h2 style=" text-align: center">Update Successful</h2>
                <br>
                <p style="padding-left: 25px;">Your password has been securely updated. The recovery protocol is now complete.</p>

            <div class="message info" style="border-left-color: #16a34a; background-color: #f0fdf4;">

            </div>

            <div class="auth-footer">
                <a href="{% url 'login' %}" class="btn-primary" style="text-decoration: none; color: aliceblue; display: block; text-align: center; background-color: #0056b3;">Proceed to Sign In</a>
