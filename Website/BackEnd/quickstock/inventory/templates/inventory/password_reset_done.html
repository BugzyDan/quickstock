{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickStock JA | Protocol Initiated</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'inventory/css/style.css' %}">
</head>

<body class="auth-body page-password-reset">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-intro">
                <div class="security-icon">📩</div>
                <h2>Dispatch Sent</h2>
                <p>A secure recovery link has been dispatched to your registered email address.</p>
            </div>

            <div class="message info">
                <p>Please check your inbox (and spam folder) for the authorization link. The link will remain active for 24 hours.</p>
            </div>

            <div class="auth-footer">
                <a href="{% url 'login' %}" class="btn-primary">Return to Sign In</a>
            </div>
        </div>
    </div>
   
</body>
</html>
