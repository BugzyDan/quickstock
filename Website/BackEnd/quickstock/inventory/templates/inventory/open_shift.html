{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Register | QuickStock POS</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="{% static 'inventory/css/style.css' %}?v=system-font-refine-1">
    <script src="{% static 'inventory/js/loading_states.js' %}?v=loading-states-2" defer></script>
</head>
<body class="page-open-shift">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            
            <div class="card register-card">
                <div class="card-body p-5">
                    
                    <div class="text-center">
                        <div class="card-header-icon">
                            <i class="bi bi-calculator-fill" style="font-size: 2.5rem;"></i>
                        </div>
                        <h2 class="fw-bold mb-1">Open Register</h2>
                        <div class="location-badge mb-4">
                            <i class="bi bi-geo-alt-fill me-1"></i>
                            {{ profile.default_location.name|default:"Main Branch" }}
                        </div>
                    </div>

                    <form method="POST" action="{% url 'open_shift' %}">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ next_url|default:'' }}">

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-uppercase text-muted">Starting Cash (Float)</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text text-success fw-bold">$</span>
                                <input type="number" step="0.01" name="opening_cash" 
                                       class="form-control fw-bold" placeholder="0.00" 
                                       required autofocus>
                            </div>
                            <div class="form-text mt-2">
                                Verify the physical cash in your drawer before starting.
                            </div>
                        </div>

                        <div class="d-grid gap-3">
                            <button type="submit" class="btn btn-primary btn-lg btn-primary-custom">
                                <i class="bi bi-play-fill me-2"></i>Open Shift
                            </button>
                            <a href="{{ next_url|default:'/' }}" class="btn btn-link text-decoration-none text-muted small">
                                <i class="bi bi-arrow-left me-1"></i>Back
                            </a>
                        </div>
                    </form>

                </div>
            </div>

            <div class="text-center mt-4">
                <p class="text-muted small">
                    <i class="bi bi-lock-fill me-1"></i> Secure POS Session • 
                    <strong>{{ user.username }}</strong>
                </p>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.min.js"></script>
</body>
</html>
