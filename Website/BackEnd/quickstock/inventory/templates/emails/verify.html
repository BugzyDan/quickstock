<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your QuickStock Account</title>
</head>
<body style="margin: 0; padding: 0; background: #f5f7fb; font-family: Arial, Helvetica, sans-serif; color: #1f2937;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: #f5f7fb; padding: 30px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 560px; background: #ffffff; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);">
                    <tr>
                        <td style="background: #0f172a; padding: 20px 28px;">
                            <div style="font-size: 18px; font-weight: 700; color: #ffffff; letter-spacing: 0.5px;">QUICKSTOCK JA</div>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 28px;">
                            <h1 style="margin: 0 0 12px; font-size: 22px; color: #111827;">Verify your account</h1>
                            <p style="margin: 0 0 16px; font-size: 14px; color: #4b5563; line-height: 1.6;">
                                Hi {{ username }}, use this verification code to confirm your QuickStock JA account.
                            </p>
                            <div style="margin: 24px 0; padding: 18px; background: #eef6ff; border: 1px solid #bfdbfe; border-radius: 12px; text-align: center;">
                                <div style="font-size: 30px; letter-spacing: 0.18em; font-weight: 800; color: #1d4ed8;">{{ code }}</div>
                            </div>
                            <p style="margin: 0; font-size: 12px; color: #6b7280; line-height: 1.6;">
                                If you did not create this account, you can safely ignore this email.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
