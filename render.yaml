services:
  - type: web
    name: quickstock
    runtime: python
    rootDir: Website/BackEnd/quickstock
    buildCommand: ./build.sh
    startCommand: gunicorn quickstock.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: quickstock-db
          property: connectionString
      - key: DJANGO_EMAIL_HOST
        sync: false
      - key: DJANGO_EMAIL_HOST_USER
        sync: false
      - key: DJANGO_EMAIL_HOST_PASSWORD
        sync: false
      - key: DJANGO_DEFAULT_FROM_EMAIL
        sync: false
      - key: WIPAY_ENVIRONMENT
        value: live
      - key: WIPAY_ACCOUNT_NUMBER_LIVE
        sync: false
      - key: WIPAY_API_KEY_LIVE
        sync: false
      - key: WIPAY_ACCOUNT_NUMBER_SANDBOX
        sync: false
      - key: WIPAY_API_KEY_SANDBOX
        sync: false

databases:
  - name: quickstock-db
    plan: free
