server {
    listen 80;
    server_name quickstockja.com www.quickstockja.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name quickstockja.com www.quickstockja.com;

    ssl_certificate /etc/letsencrypt/live/quickstockja.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quickstockja.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:QuickStockSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50M;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";

    location /static/ {
        alias /srv/quickstock/current/Website/BackEnd/quickstock/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /srv/quickstock/current/Website/BackEnd/quickstock/media/;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_pass http://unix:/run/quickstock/gunicorn.sock;
    }
}
