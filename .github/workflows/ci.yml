name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Website/BackEnd/quickstock

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quickstock_ci
          POSTGRES_USER: quickstock
          POSTGRES_PASSWORD: quickstock_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quickstock -d quickstock_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-only-secret-key-with-at-least-fifty-characters-for-django-checks-0123456789
      DJANGO_ALLOWED_HOSTS: ci.quickstock.test
      DJANGO_CSRF_TRUSTED_ORIGINS: https://ci.quickstock.test
      # Present so production settings never fall back to MySQL; Django's test
      # runner still provisions a throwaway test database.
      DATABASE_URL: postgres://quickstock:quickstock_ci_password@localhost:5432/quickstock_ci
      QUICKSTOCK_EMAIL_PROVIDER: smtp
      DJANGO_EMAIL_HOST: localhost
      DJANGO_EMAIL_HOST_USER: ci@quickstock.test
      DJANGO_EMAIL_HOST_PASSWORD: ci-only
      DJANGO_DEFAULT_FROM_EMAIL: QuickStock CI <ci@quickstock.test>
      # CI never charges cards; this is the documented non-production escape hatch.
      WIPAY_ENVIRONMENT: sandbox
      WIPAY_ALLOW_SANDBOX_IN_PROD: "true"
      QUICKSTOCK_REQUIRE_BACKUP: "false"
      QUICKSTOCK_BACKUP_ON_BUILD: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Website/BackEnd/quickstock/requirements.txt

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Django deployment checks
        run: python manage.py check --deploy --fail-level ERROR

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Lint
        run: flake8 inventory --max-line-length=120 --exclude=migrations,__pycache__ --select=E9,F63,F7,F82

      - name: Run test suite (SQLite)
        run: python manage.py test --verbosity=2

  backend-postgres:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: Website/BackEnd/quickstock

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quickstock_ci
          POSTGRES_USER: quickstock
          POSTGRES_PASSWORD: quickstock_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quickstock -d quickstock_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-only-secret-key-with-at-least-fifty-characters-for-django-checks-0123456789
      DJANGO_ALLOWED_HOSTS: ci.quickstock.test
      DJANGO_CSRF_TRUSTED_ORIGINS: https://ci.quickstock.test
      DATABASE_URL: postgres://quickstock:quickstock_ci_password@localhost:5432/quickstock_ci
      QUICKSTOCK_EMAIL_PROVIDER: smtp
      DJANGO_EMAIL_HOST: localhost
      DJANGO_EMAIL_HOST_USER: ci@quickstock.test
      DJANGO_EMAIL_HOST_PASSWORD: ci-only
      DJANGO_DEFAULT_FROM_EMAIL: QuickStock CI <ci@quickstock.test>
      # CI never charges cards; this is the documented non-production escape hatch.
      WIPAY_ENVIRONMENT: sandbox
      WIPAY_ALLOW_SANDBOX_IN_PROD: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Website/BackEnd/quickstock/requirements.txt

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify database backup command
        run: python manage.py backup_database --output-dir /tmp/backups --retain 1

      - name: Run test suite (PostgreSQL)
        run: python manage.py test --verbosity=2

  desktop:
    name: Desktop client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Desktop_UI
    env:
      QT_QPA_PLATFORM: offscreen
      DISPLAY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Desktop_UI/requirements.txt

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk xvfb libxkbcommon-x11-0 libgl1 libegl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run desktop tests
        run: xvfb-run -a python -m pytest tests -q
