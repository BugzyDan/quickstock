{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Register | QuickStock POS</title>
    
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="{% static 'inventory/css/style.css' %}">
    <script src="{% static 'inventory/js/loading_states.js' %}?v=loading-states-2" defer></script>
</head>
<body class="page-open-register">

<div class="register-container">
    <div class="card card-register shadow-sm">
        <div class="card-body p-4 p-md-5">
            
            <div class="text-center">
                <div class="icon-circle">
                    <i class="bi bi-door-open-fill" style="font-size: 2rem;"></i>
                </div>
                <h2 class="fw-bold mb-1">Open Register</h2>
                <div class="location-tag mb-4">
                    <i class="bi bi-geo-alt-fill me-1"></i>
                    {{ profile.default_location.name|default:"Assigning Location..." }}
                </div>
            </div>

            <form method="POST" action="{% url 'open_shift' %}">
                {% csrf_token %}

                <div class="mb-4">
                    <label class="form-label small fw-bold text-muted text-uppercase ls-1">Opening Cash (Float)</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text bg-white border-end-0 text-success fw-bold">$</span>
                        <input type="number" step="0.01" name="opening_cash" 
                               class="form-control border-start-0 ps-0 fw-bold" 
                               placeholder="0.00" required autofocus>
                    </div>
                    <div class="form-text mt-2 small">
                        Please count the physical cash in your drawer before starting.
                    </div>
                </div>

                <div class="d-grid gap-3">
                    <button type="submit" class="btn btn-primary btn-lg btn-start shadow-sm">
                        <i class="bi bi-play-circle-fill me-2"></i>Start Session
                    </button>
                    <a href="/" class="btn btn-link text-decoration-none text-muted small py-0">
                        <i class="bi bi-arrow-left me-1
